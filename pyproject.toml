[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-crm"
version = "0.1.0"
description = "A terminal CRM with local LLM chat — import leads, dial, and log outcomes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers",
    "torch",
    "rich",
    "prompt-toolkit",
    "accelerate",
    "questionary",
    "sentence-transformers",
    "pyperclip",
]

[project.scripts]
terminal-crm = "main:main"

[tool.setuptools]
py-modules = ["main"]
